kind = "web"
previewPath = "/"
title = "ANTI HANTA"
version = "1.0.0"
id = "artifacts/anti-hanta"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23407

[services.development]
run = "pnpm --filter @workspace/anti-hanta run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/anti-hanta", "run", "build" ]
publicDir = "artifacts/anti-hanta/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23407"
BASE_PATH = "/"
